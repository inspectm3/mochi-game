<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Candy Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1a0033;}
#game-frame{width:100%;height:100%;border:none;display:block;position:fixed;inset:0;}
#vc-btn{
  position:fixed;bottom:16px;right:16px;
  z-index:999;
  font-family:'Fredoka One',cursive;
  font-size:.85rem;
  background:linear-gradient(135deg,#ff4d9d,#c2185b);
  color:#fff;border:none;border-radius:30px;
  padding:10px 18px;cursor:pointer;
  box-shadow:0 4px 16px rgba(194,24,91,.5);
  display:flex;align-items:center;gap:7px;
  transition:transform .1s,opacity .2s;
}
#vc-btn:hover{transform:translateY(-2px);}
#vc-btn:active{transform:translateY(1px);}
</style>
</head>
<body>
  <iframe id="game-frame" src="candyland_powerups.html?v=30"
    allow="autoplay; camera; microphone; fullscreen; display-capture; accelerometer; gyroscope; execution-while-not-rendered; execution-while-out-of-viewport"
    allowfullscreen></iframe>

  <button id="vc-btn" onclick="openVC()">📹 Video Chat</button>

<script>
const DEFAULT_WHEREBY='https://whereby.com/mochigame';
const saved=localStorage.getItem('mochi-whereby-url')||DEFAULT_WHEREBY;

function openVC(){
  let url=saved;
  const sep=url.includes('?')?'&':'?';
  url+=sep+'minimal&skipMediaPermissionPrompt&background=off&chat=on&people=off&screenshare=off&leaveButton=on&displayName=Player&timer=off&logo=off';
  window.open(url,'_blank','width=480,height=640,menubar=no,toolbar=no,location=no');
}

// Allow game to post room code up to parent (no-op here but kept for compat)
window.addEventListener('message', e=>{
  if(e.data&&e.data.type==='mpRoom') console.log('Room:', e.data.room);
});
</script>
</body>
</html>
