<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Candy Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1a0033;}
#game-frame{width:100%;height:100%;border:none;display:block;position:fixed;inset:0;}

/* Video chat pop-out button */
#vc-btn{
  position:fixed;bottom:20px;right:20px;
  z-index:9999;
  font-family:'Fredoka One',cursive;
  font-size:.85rem;
  background:linear-gradient(135deg,#ff4d9d,#c2185b);
  color:#fff;border:none;border-radius:30px;
  padding:11px 20px;cursor:pointer;
  box-shadow:0 4px 20px rgba(194,24,91,.5);
  display:flex;align-items:center;gap:8px;
  transition:transform .15s,box-shadow .15s;
  user-select:none;
}
#vc-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(194,24,91,.6);}
#vc-btn:active{transform:translateY(0);}

/* Setup modal */
#vc-modal{
  display:none;
  position:fixed;inset:0;z-index:10000;
  background:rgba(10,0,24,.85);
  align-items:center;justify-content:center;
}
#vc-modal.show{display:flex;}
#vc-box{
  background:linear-gradient(160deg,#1a0033,#2d0a5e);
  border:1.5px solid rgba(255,77,157,.3);
  border-radius:20px;padding:32px;width:340px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  font-family:'Fredoka One',cursive;
}
#vc-box h3{color:#ff9de2;font-size:1.2rem;text-align:center;}
#vc-box p{color:rgba(255,200,255,.55);font-size:.78rem;text-align:center;line-height:1.6;font-family:'Segoe UI',sans-serif;}
#vc-box .steps{background:rgba(255,77,157,.08);border-radius:12px;padding:12px 16px;width:100%;}
#vc-box .steps strong{color:#ff9de2;font-size:.76rem;display:block;margin-bottom:4px;}
#vc-box .steps p{text-align:left;font-size:.72rem;}
#vc-inp{
  width:100%;padding:10px 16px;border-radius:14px;
  border:1.5px solid rgba(255,77,157,.4);
  background:rgba(255,255,255,.07);color:#fff;
  font-size:.82rem;outline:none;text-align:center;
  font-family:'Segoe UI',sans-serif;
}
#vc-inp::placeholder{color:rgba(255,200,255,.3);}
#vc-go{
  font-family:'Fredoka One',cursive;
  padding:10px 28px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#ff4d9d,#c2185b);
  color:#fff;cursor:pointer;font-size:.95rem;width:100%;
}
#vc-go:hover{opacity:.88;}
#vc-cancel{
  background:none;border:none;color:rgba(255,200,255,.35);
  font-size:.75rem;cursor:pointer;font-family:'Segoe UI',sans-serif;
}
#vc-cancel:hover{color:rgba(255,200,255,.6);}
#vc-saved-note{font-size:.68rem;color:rgba(255,200,255,.25);font-family:'Segoe UI',sans-serif;}
</style>
</head>
<body>

<iframe id="game-frame" src="candyland_powerups.html?v=33"
  allow="autoplay; camera; microphone; fullscreen; display-capture; accelerometer; gyroscope"
  allowfullscreen></iframe>

<button id="vc-btn" onclick="openVC()">📹 Video Chat</button>

<!-- Setup modal shown first time -->
<div id="vc-modal">
  <div id="vc-box">
    <div style="font-size:2.5rem;">📹</div>
    <h3>Set Up Video Chat</h3>
    <p>Paste your <strong style="color:#ff9de2;">Whereby host room URL</strong> — everyone joins instantly, no waiting room.</p>
    <div class="steps">
      <strong>Get your host link:</strong>
      <p>1. Sign up free at <strong>whereby.com</strong><br>
      2. Create a room → click <strong>Share</strong><br>
      3. Copy the <strong>Host link</strong><br>
      <em style="color:rgba(255,200,255,.4);">Looks like: whereby.com/yourroom?roomKey=abc</em></p>
    </div>
    <input id="vc-inp" type="url" placeholder="https://whereby.com/yourroom?roomKey=..." autocomplete="off">
    <button id="vc-go" onclick="saveAndOpen()">Open Video Chat ▶</button>
    <button id="vc-cancel" onclick="closeModal()">Maybe later</button>
    <span id="vc-saved-note">Your URL is saved — you only enter it once</span>
  </div>
</div>

<script>
const DEFAULT_URL = 'https://whereby.com/mochigame';
const STORAGE_KEY = 'mochi-whereby-url';

function getWherebyURL(){
  const raw = localStorage.getItem(STORAGE_KEY) || DEFAULT_URL;
  let url = raw;
  const sep = url.includes('?') ? '&' : '?';
  url += sep + 'minimal&skipMediaPermissionPrompt&background=off&chat=on&people=off&screenshare=off&leaveButton=on&displayName=Player&timer=off&logo=off&virtualBackgrounds=off';
  return url;
}

function openVC(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(!saved){
    // First time — show setup modal
    document.getElementById('vc-inp').value = '';
    document.getElementById('vc-modal').classList.add('show');
    setTimeout(()=>document.getElementById('vc-inp').focus(), 100);
    return;
  }
  // Already set up — pop open directly
  launchWherebyWindow();
}

function saveAndOpen(){
  const raw = document.getElementById('vc-inp').value.trim();
  if(!raw || !raw.includes('whereby.com')){
    document.getElementById('vc-inp').style.borderColor='#ff4d4d';
    setTimeout(()=>document.getElementById('vc-inp').style.borderColor='rgba(255,77,157,.4)',1500);
    return;
  }
  localStorage.setItem(STORAGE_KEY, raw);
  closeModal();
  launchWherebyWindow();
}

function launchWherebyWindow(){
  const url = getWherebyURL();
  const w = Math.min(520, screen.width - 40);
  const h = Math.min(680, screen.height - 40);
  const left = screen.width - w - 20;
  const top = 20;
  const win = window.open(url, 'mochi-vc',
    `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no`);
  if(!win){
    // Popup blocked — show instructions
    alert('Please allow popups for this site to use video chat.\n\nClick the popup blocked icon in your address bar and select "Always allow".');
  }
}

function closeModal(){
  document.getElementById('vc-modal').classList.remove('show');
}

// Allow changing the room URL: long-press or right-click the button
document.getElementById('vc-btn').addEventListener('contextmenu', e=>{
  e.preventDefault();
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('vc-inp').value = localStorage.getItem(STORAGE_KEY) || '';
  document.getElementById('vc-modal').classList.add('show');
  setTimeout(()=>document.getElementById('vc-inp').focus(), 100);
});

document.getElementById('vc-inp').addEventListener('keydown', e=>{
  if(e.key==='Enter') saveAndOpen();
  e.stopPropagation();
});

// Pass room codes from game iframe up
window.addEventListener('message', e=>{
  if(e.data && e.data.type==='mpRoom') console.log('Room:', e.data.room);
});
</script>
</body>
</html>
